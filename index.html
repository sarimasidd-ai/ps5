<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark only">
<title>PS5 Fund — Savings HUD</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0D12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PS5 Fund">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0D12;color:#EDEFF3;font-family:'Manrope',sans-serif;min-height:100vh}

.pf-shell{max-width:460px;margin:0 auto;padding:28px 20px 56px}

.pf-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.pf-brand{display:flex;flex-direction:column;gap:4px}
.pf-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.22em;color:#6B7686;text-transform:uppercase}
.pf-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em;color:#F2F4F7}
.pf-icon-btn{
  background:#151A21;border:1px solid #232A35;color:#C7CDD6;border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.15s;flex:none;font-size:16px;
}
.pf-icon-btn:hover{border-color:#E8B84B;color:#E8B84B}

.pf-settings{
  background:#131820;border:1px solid #232A35;border-radius:14px;padding:16px;
  margin-bottom:22px;display:none;flex-direction:column;gap:12px;
}
.pf-settings.open{display:flex}
.pf-field label{
  display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;
  color:#8A94A3;text-transform:uppercase;margin-bottom:6px;
}
.pf-field input{
  width:100%;background:#0E1219;border:1px solid #232A35;border-radius:8px;
  padding:11px 12px;color:#EDEFF3;font-family:'Manrope',sans-serif;font-size:15px;
}
.pf-field input:focus{outline:2px solid #E8B84B;outline-offset:1px;border-color:#E8B84B}

.pf-gaugewrap{position:relative;width:220px;height:220px;margin:6px auto 18px}
.pf-gauge{width:100%;height:100%;overflow:visible}
.pf-ring-track{stroke:#1B222C}
.pf-ring-fill{stroke:#E8B84B;transition:stroke-dasharray .6s cubic-bezier(.22,.9,.3,1)}
.pf-ring-reached{stroke:#4FE0A0 !important}
.pf-gauge-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;text-align:center;
}
.pf-gauge-amount{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;color:#F2F4F7}
.pf-gauge-of{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6B7686;letter-spacing:.05em}
.pf-reached-chip{
  margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  color:#0A0D12;background:#4FE0A0;padding:4px 9px;border-radius:100px;font-weight:600;display:none;
}
.pf-reached-chip.show{display:inline-block}

.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.pf-stat{background:#131820;border:1px solid #1E252F;border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.pf-stat-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:#6B7686}
.pf-stat-value{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#EDEFF3}
.pf-deadline-note{text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#4F5A68;margin:8px 0 22px}

.pf-quickrow{display:flex;gap:8px;margin-bottom:22px}
.pf-chip{
  flex:1;background:#151A21;border:1px solid #232A35;color:#C7CDD6;border-radius:100px;
  padding:9px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;cursor:pointer;transition:.15s;
}
.pf-chip:hover{border-color:#E8B84B;color:#E8B84B}

.pf-logcard{background:#131820;border:1px solid #1E252F;border-radius:16px;padding:16px;margin-bottom:26px}
.pf-toggle{display:flex;gap:8px;margin-bottom:12px}
.pf-toggle-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  background:#0E1219;border:1px solid #232A35;color:#8A94A3;border-radius:9px;
  padding:9px 0;font-family:'Manrope',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s;
}
.pf-toggle-on{background:#E8B84B;border-color:#E8B84B;color:#12100A}
.pf-toggle-spend.pf-toggle-on{background:#E8604B;border-color:#E8604B;color:#1C0A06}

.pf-form-row{display:flex;gap:8px;margin-bottom:12px}
.pf-amount-input{
  width:96px;flex:none;background:#0E1219;border:1px solid #232A35;border-radius:8px;
  padding:11px 10px;color:#EDEFF3;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;
}
.pf-note-input{
  flex:1;min-width:0;background:#0E1219;border:1px solid #232A35;border-radius:8px;
  padding:11px 12px;color:#EDEFF3;font-family:'Manrope',sans-serif;font-size:14px;
}
.pf-amount-input:focus,.pf-note-input:focus{outline:2px solid #E8B84B;outline-offset:1px;border-color:#E8B84B}

.pf-btn{border:none;border-radius:9px;padding:12px 0;font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s;width:100%}
.pf-btn-gold{background:#E8B84B;color:#12100A}
.pf-btn-gold:hover{background:#F0C666}
.pf-btn-spend{background:#E8604B;color:#1C0A06}
.pf-btn-spend:hover{background:#EF7A63}

.pf-history-head{display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;color:#6B7686;margin-bottom:12px}
.pf-empty{color:#6B7686;font-size:13.5px;text-align:center;padding:24px 10px;border:1px dashed #232A35;border-radius:12px}
.pf-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.pf-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #171C24}
.pf-item:last-child{border-bottom:none}
.pf-item-dot{width:6px;height:6px;border-radius:50%;flex:none}
.pf-dot-in{background:#E8B84B}
.pf-dot-out{background:#E8604B}
.pf-item-note{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-item-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#5A6472;flex:none}
.pf-item-amount{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;flex:none;min-width:52px;text-align:right}
.pf-in{color:#E8B84B}
.pf-out{color:#E8604B}
.pf-del{background:none;border:none;color:#3D4552;cursor:pointer;padding:4px;flex:none;font-size:14px}
.pf-del:hover{color:#E8604B}

@media (prefers-reduced-motion: reduce){.pf-ring-fill{transition:none}}
</style>
</head>
<body>

<div class="pf-shell">
  <header class="pf-header">
    <div class="pf-brand">
      <span class="pf-eyebrow">SAVINGS HUD</span>
      <h1 class="pf-title">PS5 FUND</h1>
    </div>
    <button class="pf-icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <div class="pf-settings" id="settingsPanel">
    <div class="pf-field">
      <label for="goalInput">Goal amount</label>
      <input id="goalInput" type="number" inputmode="decimal" placeholder="400">
    </div>
    <div class="pf-field">
      <label for="deadlineInput">Target date</label>
      <input id="deadlineInput" type="date">
    </div>
    <button class="pf-btn pf-btn-gold" id="saveSettingsBtn">Save target</button>
  </div>

  <div class="pf-gaugewrap">
    <svg viewBox="0 0 200 200" class="pf-gauge">
      <circle cx="100" cy="100" r="90" class="pf-ring-track" stroke-width="14" fill="none"></circle>
      <circle cx="100" cy="100" r="90" class="pf-ring-fill" id="ringFill" stroke-width="14" fill="none"
        stroke-linecap="round" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="pf-gauge-center">
      <span class="pf-gauge-amount" id="gaugeAmount">$0</span>
      <span class="pf-gauge-of" id="gaugeOf">of $400</span>
      <span class="pf-reached-chip" id="reachedChip">GOAL REACHED</span>
    </div>
  </div>

  <div class="pf-stats">
    <div class="pf-stat"><span class="pf-stat-label">NEED</span><span class="pf-stat-value" id="statNeed">$0</span></div>
    <div class="pf-stat"><span class="pf-stat-label">DAYS LEFT</span><span class="pf-stat-value" id="statDays">0</span></div>
    <div class="pf-stat"><span class="pf-stat-label">PER DAY</span><span class="pf-stat-value" id="statPerDay">$0</span></div>
  </div>
  <p class="pf-deadline-note" id="deadlineNote">Target: —</p>

  <div class="pf-quickrow">
    <button class="pf-chip" data-quick="5">+$5</button>
    <button class="pf-chip" data-quick="10">+$10</button>
    <button class="pf-chip" data-quick="20">+$20</button>
    <button class="pf-chip" data-quick="50">+$50</button>
  </div>

  <div class="pf-logcard">
    <div class="pf-toggle">
      <button class="pf-toggle-btn pf-toggle-on" id="depositToggle">+ Deposit</button>
      <button class="pf-toggle-btn pf-toggle-spend" id="spendToggle">− Spend</button>
    </div>
    <div class="pf-form-row">
      <input class="pf-amount-input" id="amountInput" type="number" inputmode="decimal" placeholder="0.00">
      <input class="pf-note-input" id="noteInput" type="text" placeholder="Where'd it come from?">
    </div>
    <button class="pf-btn pf-btn-gold" id="addBtn">Log deposit</button>
  </div>

  <div>
    <div class="pf-history-head"><span>HISTORY</span></div>
    <div id="historyWrap"></div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'ps5-fund-data';
  var DEFAULT_DATA = {
    goal: 400,
    deadline: '2026-09-30',
    transactions: [
      { id: 'seed-1', type: 'deposit', amount: 250, note: 'Starting balance', date: new Date().toISOString() }
    ]
  };

  var data;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : DEFAULT_DATA;
  } catch(e) {
    data = DEFAULT_DATA;
  }

  var mode = 'deposit';

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }

  function fmt(n){
    var sign = n < 0 ? '-' : '';
    var s = Math.abs(n).toFixed(2).replace(/\.00$/, '');
    return sign + '$' + s;
  }
  function fmtFull(n){
    var sign = n < 0 ? '-$' : '$';
    return sign + Math.abs(n).toFixed(2);
  }
  function daysBetween(deadlineStr){
    var deadline = new Date(deadlineStr + 'T23:59:59');
    var today = new Date();
    return Math.ceil((deadline.getTime() - today.getTime()) / 86400000);
  }

  var r = 90, circumference = 2 * Math.PI * r;

  function render(){
    var balance = data.transactions.reduce(function(sum, t){
      return sum + (t.type === 'deposit' ? t.amount : -t.amount);
    }, 0);
    var goal = data.goal;
    var remaining = Math.max(0, goal - balance);
    var pct = Math.max(0, Math.min(100, (balance / goal) * 100));
    var daysLeft = daysBetween(data.deadline);
    var perDay = daysLeft > 0 ? Math.ceil((remaining / daysLeft) * 100) / 100 : remaining;
    var reached = balance >= goal;

    var dash = (pct / 100) * circumference;
    var ring = document.getElementById('ringFill');
    ring.setAttribute('stroke-dasharray', dash + ' ' + circumference);
    ring.classList.toggle('pf-ring-reached', reached);

    document.getElementById('gaugeAmount').textContent = fmtFull(balance);
    document.getElementById('gaugeOf').textContent = 'of ' + fmtFull(goal);
    document.getElementById('reachedChip').classList.toggle('show', reached);

    document.getElementById('statNeed').textContent = fmt(remaining);
    document.getElementById('statDays').textContent = daysLeft > 0 ? daysLeft : 0;
    document.getElementById('statPerDay').textContent = fmt(Math.max(0, perDay));

    var deadlineLabel = new Date(data.deadline + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
    document.getElementById('deadlineNote').textContent = 'Target: ' + deadlineLabel;

    document.getElementById('goalInput').value = data.goal;
    document.getElementById('deadlineInput').value = data.deadline;

    var wrap = document.getElementById('historyWrap');
    if(data.transactions.length === 0){
      wrap.innerHTML = '<p class="pf-empty">No transactions yet — log your first deposit above.</p>';
      return;
    }
    var sorted = data.transactions.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    var html = '<ul class="pf-list">';
    sorted.forEach(function(t){
      var dateLabel = new Date(t.date).toLocaleDateString('en-US', { month:'short', day:'numeric' });
      html += '<li class="pf-item">' +
        '<span class="pf-item-dot ' + (t.type === 'deposit' ? 'pf-dot-in' : 'pf-dot-out') + '"></span>' +
        '<span class="pf-item-note">' + escapeHtml(t.note) + '</span>' +
        '<span class="pf-item-date">' + dateLabel + '</span>' +
        '<span class="pf-item-amount ' + (t.type === 'deposit' ? 'pf-in' : 'pf-out') + '">' +
          (t.type === 'deposit' ? '+' : '\u2212') + fmt(t.amount).replace('-','') +
        '</span>' +
        '<button class="pf-del" data-del="' + t.id + '">\u2715</button>' +
      '</li>';
    });
    html += '</ul>';
    wrap.innerHTML = html;

    Array.prototype.forEach.call(wrap.querySelectorAll('[data-del]'), function(btn){
      btn.addEventListener('click', function(){
        data.transactions = data.transactions.filter(function(t){ return t.id !== btn.getAttribute('data-del'); });
        save();
        render();
      });
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addTransaction(){
    var amount = parseFloat(document.getElementById('amountInput').value);
    if(!amount || amount <= 0) return;
    var note = document.getElementById('noteInput').value.trim() || (mode === 'deposit' ? 'Deposit' : 'Spent');
    data.transactions.unshift({
      id: 't-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      type: mode, amount: Math.round(amount*100)/100, note: note, date: new Date().toISOString()
    });
    save();
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
    render();
  }

  function quickAdd(v){
    data.transactions.unshift({
      id: 't-' + Date.now() + '-' + Math.floor(Math.random()*1000),
      type: 'deposit', amount: v, note: 'Quick add', date: new Date().toISOString()
    });
    save();
    render();
  }

  document.getElementById('depositToggle').addEventListener('click', function(){
    mode = 'deposit';
    this.classList.add('pf-toggle-on');
    document.getElementById('spendToggle').classList.remove('pf-toggle-on');
    document.getElementById('noteInput').placeholder = "Where'd it come from?";
    var btn = document.getElementById('addBtn');
    btn.textContent = 'Log deposit';
    btn.classList.remove('pf-btn-spend'); btn.classList.add('pf-btn-gold');
  });
  document.getElementById('spendToggle').addEventListener('click', function(){
    mode = 'spend';
    this.classList.add('pf-toggle-on');
    document.getElementById('depositToggle').classList.remove('pf-toggle-on');
    document.getElementById('noteInput').placeholder = 'What for?';
    var btn = document.getElementById('addBtn');
    btn.textContent = 'Log expense';
    btn.classList.remove('pf-btn-gold'); btn.classList.add('pf-btn-spend');
  });

  document.getElementById('addBtn').addEventListener('click', addTransaction);
  document.getElementById('noteInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') addTransaction(); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-quick]'), function(btn){
    btn.addEventListener('click', function(){ quickAdd(parseFloat(btn.getAttribute('data-quick'))); });
  });

  document.getElementById('settingsBtn').addEventListener('click', function(){
    document.getElementById('settingsPanel').classList.toggle('open');
  });
  document.getElementById('saveSettingsBtn').addEventListener('click', function(){
    var g = parseFloat(document.getElementById('goalInput').value);
    var d = document.getElementById('deadlineInput').value;
    if(!g || g <= 0) return;
    data.goal = Math.round(g*100)/100;
    if(d) data.deadline = d;
    save();
    document.getElementById('settingsPanel').classList.remove('open');
    render();
  });

  save();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
