<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tideline Player</title>
<meta name="theme-color" content="#121212">
<style>
  :root {
    --bg: #121212;
    --surface: #181818;
    --surface-2: #242424;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: var(--art-light);
    /* Set from the cover art by extractColors() */
    --art-raw: #535353;
    --art-dark: #2a2a2a;
    --art-light: #d0d0d0;
    --bar-h: 88px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* ---------- Main view: background tinted by the cover ---------- */
  main {
    position: absolute; inset: 0 0 var(--bar-h) 0;
    overflow-y: auto;
    padding: 24px 16px 32px;
  }
  .tint {
    position: absolute; inset: 0 0 var(--bar-h) 0; pointer-events: none;
    background: linear-gradient(180deg, var(--art-dark) 0%, var(--bg) 70%);
    transition: background 0.8s ease;
  }
  /* CSS can't animate gradients, so cross-fade a second layer instead */
  .tint.next { opacity: 0; transition: opacity 0.8s ease; }
  .tint.next.show { opacity: 1; }
  .content { position: relative; max-width: 920px; margin: 0 auto; }

  .hero { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 28px; }
  .hero img {
    width: 232px; height: 232px; max-width: 100%; border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5); object-fit: cover; background: var(--surface-2);
  }
  .hero .meta { min-width: 0; flex: 1 1 240px; }
  .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .hero h1 { font-size: clamp(32px, 7vw, 64px); line-height: 1.05; margin: 6px 0 10px; font-weight: 800; word-break: break-word; }
  .swatches { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .swatch[hidden] { display: none; }
  .swatch i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid rgba(255,255,255,.2); }

  .toolbar { display: flex; gap: 12px; align-items: center; margin: 8px 0 16px; flex-wrap: wrap; }
  .big-play {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #000;
    display: grid; place-items: center; transition: transform .1s;
  }
  .big-play:hover { transform: scale(1.05); }
  .add-btn {
    border: 1px solid #727272; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
  }
  .add-btn:hover { border-color: var(--text); }

  ol.tracks { list-style: none; margin: 0; padding: 0; }
  ol.tracks li {
    display: grid; grid-template-columns: 28px 40px 1fr auto; gap: 12px; align-items: center;
    padding: 8px 12px; border-radius: 4px; cursor: pointer;
  }
  ol.tracks li:hover { background: rgba(255,255,255,.08); }
  ol.tracks li.active .t-title { color: var(--accent); }
  .t-num { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  ol.tracks img { width: 40px; height: 40px; border-radius: 3px; object-fit: cover; }
  .t-title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-artist { color: var(--muted); font-size: 13px; }
  .t-dur { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Now-playing bar ---------- */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar-h);
    background: #000; display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center;
    padding: 0 16px; gap: 16px;
  }
  .np { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .np img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: var(--surface-2); }
  .np .t { min-width: 0; }
  .np .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .a { color: var(--muted); font-size: 12px; }

  .center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .controls { display: flex; align-items: center; gap: 18px; }
  .ctl { color: var(--muted); display: grid; place-items: center; width: 32px; height: 32px; }
  .ctl:hover { color: var(--text); }
  .ctl.on { color: var(--accent); }
  .play {
    width: 34px; height: 34px; border-radius: 50%; background: var(--text); color: #000;
    display: grid; place-items: center;
  }
  .play:hover { transform: scale(1.06); }

  .progress { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 620px; }
  .time { font-size: 11px; color: var(--muted); min-width: 36px; font-variant-numeric: tabular-nums; }
  .time.l { text-align: right; }

  /* Shared slider: grey track, white fill, accent + knob on hover/drag */
  .slider { position: relative; flex: 1; height: 12px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .slider .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: #4d4d4d; overflow: hidden; }
  .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); width: 0; }
  .slider .knob {
    position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--text);
    transform: translateX(-50%); left: 0; opacity: 0; box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  .slider:hover .fill, .slider.dragging .fill { background: var(--accent); }
  .slider:hover .knob, .slider.dragging .knob, .slider:focus-visible .knob { opacity: 1; }

  .right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .right .slider { max-width: 110px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 720px) {
    :root { --bar-h: 128px; }
    .bar { grid-template-columns: 1fr auto; grid-template-rows: auto auto; padding: 8px 16px 12px; gap: 6px 12px; }
    .center { grid-column: 1 / -1; grid-row: 2; }
    .right .slider, .right .vol-icon { display: none; }
    .hero img { width: 160px; height: 160px; }
    ol.tracks li { grid-template-columns: 40px 1fr auto; }
    .t-num { display: none; }
  }
</style>
</head>
<body>
  <div class="tint" id="tintA"></div>
  <div class="tint next" id="tintB"></div>

  <main>
    <div class="content">
      <section class="hero">
        <img id="heroArt" alt="">
        <div class="meta">
          <div class="eyebrow">Playlist</div>
          <h1 id="heroTitle">Tideline Mix</h1>
          <div class="t-artist" id="heroSub">3 tracks</div>
          <div class="swatches" aria-label="Colors pulled from the cover">
            <span class="swatch"><i id="swRaw"></i>raw</span>
            <span class="swatch"><i id="swDark"></i>dark</span>
            <span class="swatch"><i id="swLight"></i>light</span>
            <span class="swatch" id="swFallback" hidden>· fallback</span>
          </div>
        </div>
      </section>

      <div class="toolbar">
        <button class="big-play" id="bigPlay" aria-label="Play">
          <svg width="22" height="22" viewBox="0 0 24 24" id="bigPlayIcon"><path fill="currentColor" d="M7 4v16l13-8z"/></svg>
        </button>
        <label class="add-btn" tabindex="0">
          + Add your music
          <input type="file" id="fileInput" accept="audio/*,image/*" multiple class="sr">
        </label>
        <span class="t-artist">Add audio files. Add an image with them to use as the cover.</span>
      </div>

      <ol class="tracks" id="trackList"></ol>
    </div>
  </main>

  <footer class="bar" aria-label="Now playing">
    <div class="np">
      <img id="npArt" alt="">
      <div class="t">
        <div id="npTitle">—</div>
        <div class="a" id="npArtist"></div>
      </div>
    </div>

    <div class="center">
      <div class="controls">
        <button class="ctl" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M13.2 1.6l2 2-2 2-.7-.7.8-.8h-1.6c-.9 0-1.7.4-2.2 1.1L5.8 10.4C5 11.5 3.8 12.2 2.4 12.2H.8v-1h1.6c1 0 1.8-.5 2.4-1.2L8.5 5C9.2 4 10.4 3.4 11.7 3.4h1.6l-.8-.8.7-1zM.8 3.8h1.6c1.3 0 2.5.6 3.3 1.6l.5.7-.6.8-.7-.9C4.4 5.3 3.4 4.8 2.4 4.8H.8v-1zm9 6.9l.6-.8.4.5c.5.7 1.3 1.1 2.2 1.1h1.6l-.8-.8.7-.7 2 2-2 2-.7-.7.8-.8h-1.6c-1.3 0-2.5-.6-3.2-1.6z"/></svg>
        </button>
        <button class="ctl" id="prevBtn" aria-label="Previous">
          <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2h1.5v12H3zM14 2v12L5.5 8z"/></svg>
        </button>
        <button class="play" id="playBtn" aria-label="Play">
          <svg width="16" height="16" viewBox="0 0 16 16" id="playIcon"><path fill="currentColor" d="M4 2v12l10-6z"/></svg>
        </button>
        <button class="ctl" id="nextBtn" aria-label="Next">
          <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M11.5 2H13v12h-1.5zM2 2v12l8.5-6z"/></svg>
        </button>
        <button class="ctl" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M4 3h8a3 3 0 013 3v3h-1.5V6c0-.8-.7-1.5-1.5-1.5H4v2L1 4l3-3v2zm8 10H4a3 3 0 01-3-3V7h1.5v3c0 .8.7 1.5 1.5 1.5h8v-2l3 2.5-3 3v-2z"/></svg>
        </button>
      </div>
      <div class="progress">
        <span class="time l" id="elapsed">0:00</span>
        <div class="slider" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="track"><div class="fill"></div></div><div class="knob"></div>
        </div>
        <span class="time" id="total">0:00</span>
      </div>
    </div>

    <div class="right">
      <button class="ctl vol-icon" id="muteBtn" aria-label="Mute">
        <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h3l4-3v10l-4-3H2zM11 5.5a3.5 3.5 0 010 5l-.7-.7a2.5 2.5 0 000-3.6zM12.8 3.7a6 6 0 010 8.6l-.7-.7a5 5 0 000-7.2z"/></svg>
      </button>
      <div class="slider" id="volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="track"><div class="fill"></div></div><div class="knob"></div>
      </div>
    </div>
  </footer>

  <audio id="audio" preload="auto"></audio>

<script>
"use strict";

/* ============================================================
   1. Color extraction
   The observed web player asks a server for {colorRaw, colorDark,
   colorLight} per image URL, caches per URL, and falls back to a
   neutral grey when extraction fails. This app has no server, so it
   computes the same triple in the browser from the image pixels.
   ============================================================ */
const FALLBACK = { raw: "#535353", dark: "#2a2a2a", light: "#d0d0d0", isFallback: true };
const colorCache = new Map(); // imageUrl -> Promise<colors>

function extractColors(url) {
  if (!colorCache.has(url)) {
    colorCache.set(url, computeColors(url).catch(() => FALLBACK));
  }
  return colorCache.get(url);
}

function computeColors(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onerror = reject;
    img.onload = () => {
      const N = 48; // downsample: plenty for a dominant color, cheap to scan
      const c = document.createElement("canvas");
      c.width = c.height = N;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, N, N);
      let data;
      try { data = ctx.getImageData(0, 0, N, N).data; } catch (e) { return reject(e); }

      // Bucket into 4-bit-per-channel bins; score buckets by count weighted
      // toward saturated mid-tones so near-black/white backgrounds don't win.
      const buckets = new Map();
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] < 128) continue;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const [h, s, l] = rgbToHsl(r, g, b);
        if (l < 0.08 || l > 0.95) continue;
        const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
        const w = 1 + s * 3 * (1 - Math.abs(l - 0.5));
        const bk = buckets.get(key) || { r: 0, g: 0, b: 0, n: 0, score: 0 };
        bk.r += r; bk.g += g; bk.b += b; bk.n++; bk.score += w;
        buckets.set(key, bk);
      }
      if (!buckets.size) return resolve(FALLBACK);

      let best = null;
      for (const bk of buckets.values()) if (!best || bk.score > best.score) best = bk;
      const r = best.r / best.n, g = best.g / best.n, b = best.b / best.n;
      const [h, s] = rgbToHsl(r, g, b);

      // Dark variant: same hue, fixed low lightness so white text stays readable.
      // Light variant: same hue, high lightness for accents on dark surfaces.
      resolve({
        raw: rgbToHex(r, g, b),
        dark: hslToHex(h, Math.min(s, 0.6), 0.24),
        light: hslToHex(h, Math.min(s, 0.7), 0.78),
        isFallback: false,
      });
    };
    img.src = url;
  });
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hslToHex(h, s, l) {
  const f = n => {
    const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  return rgbToHex(f(0), f(8), f(4));
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
}

let tintFront = document.getElementById("tintA");
let tintBack = document.getElementById("tintB");
let colorRequest = 0;

async function applyArtColors(url) {
  const req = ++colorRequest;
  const c = await extractColors(url);
  if (req !== colorRequest) return; // a newer track won the race
  const root = document.documentElement.style;
  root.setProperty("--art-raw", c.raw);
  root.setProperty("--art-light", c.light);
  // Cross-fade: paint the hidden layer with the new color, then fade it in.
  tintBack.style.background = `linear-gradient(180deg, ${c.dark} 0%, var(--bg) 70%)`;
  tintBack.classList.add("next", "show");
  tintFront.classList.add("next");
  tintFront.classList.remove("show");
  [tintFront, tintBack] = [tintBack, tintFront];
  document.querySelector('meta[name="theme-color"]').content = c.dark;
  document.getElementById("swRaw").style.background = c.raw;
  document.getElementById("swDark").style.background = c.dark;
  document.getElementById("swLight").style.background = c.light;
  document.getElementById("swFallback").hidden = !c.isFallback;
}
tintFront.classList.add("next", "show");

/* ============================================================
   2. Playback position model
   The observed player state carries a timestamp, positionAsOfTimestamp,
   playback speed and isPlaying, not a constantly updated position. The
   UI derives "now" from those, so it can render smoothly between
   updates. Here the <audio> element is the source of truth; the model
   is re-anchored on every media event and interpolated per frame.
   ============================================================ */
const audio = document.getElementById("audio");
const pos = { timestamp: 0, positionAsOfTimestamp: 0, speed: 1, isPlaying: false, duration: 0 };

function anchor() {
  pos.timestamp = performance.now();
  pos.positionAsOfTimestamp = audio.currentTime * 1000;
  pos.speed = audio.playbackRate;
  pos.isPlaying = !audio.paused && !audio.ended;
  pos.duration = isFinite(audio.duration) ? audio.duration * 1000 : 0;
}
function currentPositionMs() {
  if (!pos.isPlaying) return pos.positionAsOfTimestamp;
  const p = pos.positionAsOfTimestamp + (performance.now() - pos.timestamp) * pos.speed;
  return Math.min(p, pos.duration || p);
}
["play", "pause", "seeked", "ratechange", "loadedmetadata", "timeupdate", "ended", "waiting", "playing"]
  .forEach(ev => audio.addEventListener(ev, () => { anchor(); renderPlayState(); }));

/* ============================================================
   3. Sliders: click ("hit") vs drag seeking
   The observed seek bar previews the position while dragging and
   commits a single seek on release, recording whether it was a
   click or a drag. Same here.
   ============================================================ */
function makeSlider(el, { onPreview, onCommit, getValue, step = 0.05 }) {
  const fill = el.querySelector(".fill"), knob = el.querySelector(".knob");
  let dragging = false, moved = false, preview = 0;

  const frac = x => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)); };
  const paint = f => { fill.style.width = f * 100 + "%"; knob.style.left = f * 100 + "%"; };

  el.addEventListener("pointerdown", e => {
    dragging = true; moved = false; el.setPointerCapture(e.pointerId); el.classList.add("dragging");
    preview = frac(e.clientX); paint(preview); onPreview && onPreview(preview);
  });
  el.addEventListener("pointermove", e => {
    if (!dragging) return;
    moved = true; preview = frac(e.clientX); paint(preview); onPreview && onPreview(preview);
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; el.classList.remove("dragging");
    onCommit(preview, moved ? "drag" : "hit");
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", e => {
    const d = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    onCommit(Math.max(0, Math.min(1, getValue() + d)), "key");
  });
  return { paint, isDragging: () => dragging };
}

const seekEl = document.getElementById("seek");
const elapsedEl = document.getElementById("elapsed");
const totalEl = document.getElementById("total");
const fmt = ms => {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

const seek = makeSlider(seekEl, {
  getValue: () => pos.duration ? currentPositionMs() / pos.duration : 0,
  onPreview: f => { elapsedEl.textContent = fmt(f * pos.duration); },
  onCommit: (f, kind) => {
    if (!pos.duration) return;
    const ms = f * pos.duration;
    audio.currentTime = ms / 1000;
    pos.positionAsOfTimestamp = ms; pos.timestamp = performance.now(); // show it immediately
    console.debug(`seek ${kind} → ${fmt(ms)}`);
  },
});

const volEl = document.getElementById("volume");
const volume = makeSlider(volEl, {
  getValue: () => audio.volume,
  onPreview: f => { audio.volume = f; audio.muted = false; },
  onCommit: f => { audio.volume = f; audio.muted = false; volume.paint(f); volEl.setAttribute("aria-valuenow", Math.round(f * 100)); },
});
audio.volume = 0.8; volume.paint(0.8);
document.getElementById("muteBtn").onclick = () => {
  audio.muted = !audio.muted; volume.paint(audio.muted ? 0 : audio.volume);
};

function frame() {
  if (!seek.isDragging()) {
    const p = currentPositionMs();
    const f = pos.duration ? p / pos.duration : 0;
    seek.paint(f);
    elapsedEl.textContent = fmt(p);
    seekEl.setAttribute("aria-valuenow", Math.round(p / 1000));
  }
  totalEl.textContent = fmt(pos.duration);
  seekEl.setAttribute("aria-valuemax", Math.round(pos.duration / 1000));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   4. Queue, controls, Media Session
   ============================================================ */
let tracks = [];
let order = [];      // indices into tracks, in play order
let cursor = -1;     // position in order
let shuffle = false, repeat = false;

const PLAY_PATH = "M4 2v12l10-6z", PAUSE_PATH = "M3 2h3.5v12H3zM9.5 2H13v12H9.5z";
function renderPlayState() {
  const playing = !audio.paused && !audio.ended;
  document.querySelector("#playIcon path").setAttribute("d", playing ? PAUSE_PATH : PLAY_PATH);
  document.querySelector("#bigPlayIcon path").setAttribute("d", playing ? "M6 4h4v16H6zM14 4h4v16h-4z" : "M7 4v16l13-8z");
  document.getElementById("playBtn").setAttribute("aria-label", playing ? "Pause" : "Play");
  document.getElementById("bigPlay").setAttribute("aria-label", playing ? "Pause" : "Play");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
}

function buildOrder(keepCurrent) {
  const cur = order[cursor];
  order = tracks.map((_, i) => i);
  if (shuffle) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    if (keepCurrent && cur !== undefined) { order.splice(order.indexOf(cur), 1); order.unshift(cur); }
  }
  cursor = keepCurrent && cur !== undefined ? order.indexOf(cur) : 0;
}

function load(index, autoplay = true) {
  const t = tracks[index];
  if (!t) return;
  cursor = order.indexOf(index);
  if (t.src) audio.src = t.src; else audio.removeAttribute("src");
  document.getElementById("npTitle").textContent = t.title;
  document.getElementById("npArtist").textContent = t.artist;
  document.getElementById("npArt").src = t.cover;
  document.getElementById("heroArt").src = t.cover;
  document.getElementById("heroTitle").textContent = t.title;
  document.getElementById("heroSub").textContent = `${t.artist} · track ${index + 1} of ${tracks.length}`;
  document.querySelectorAll("#trackList li").forEach((li, i) => li.classList.toggle("active", i === index));
  applyArtColors(t.cover);
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: [{ src: t.cover, sizes: "512x512" }] });
  }
  if (autoplay) audio.play().catch(() => {});
}

function step(dir) {
  if (!tracks.length) return;
  // Like most players: "previous" restarts the track if you're past 3s.
  if (dir < 0 && currentPositionMs() > 3000) { audio.currentTime = 0; return; }
  let next = cursor + dir;
  if (next >= order.length) { if (!repeat) { audio.pause(); audio.currentTime = 0; return; } next = 0; }
  if (next < 0) next = repeat ? order.length - 1 : 0;
  load(order[next]);
}

function togglePlay() {
  if (!audio.getAttribute("src")) return load(order[cursor] ?? 0);
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}

document.getElementById("playBtn").onclick = togglePlay;
document.getElementById("bigPlay").onclick = togglePlay;
document.getElementById("nextBtn").onclick = () => step(1);
document.getElementById("prevBtn").onclick = () => step(-1);
document.getElementById("shuffleBtn").onclick = e => {
  shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); e.currentTarget.setAttribute("aria-pressed", shuffle);
  buildOrder(true);
};
document.getElementById("repeatBtn").onclick = e => {
  repeat = !repeat; e.currentTarget.classList.toggle("on", repeat); e.currentTarget.setAttribute("aria-pressed", repeat);
};
audio.addEventListener("ended", () => step(1));

document.addEventListener("keydown", e => {
  if (e.target.closest("input, [role=slider]")) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
});

if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("play", togglePlay);
  ms.setActionHandler("pause", togglePlay);
  ms.setActionHandler("previoustrack", () => step(-1));
  ms.setActionHandler("nexttrack", () => step(1));
  try { ms.setActionHandler("seekto", d => { audio.currentTime = d.seekTime; }); } catch {}
}

function renderList() {
  const ol = document.getElementById("trackList");
  ol.innerHTML = "";
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="t-num">${i + 1}</span><img alt=""><div style="min-width:0"><div class="t-title"></div><div class="t-artist"></div></div><span class="t-dur">${t.durationMs ? fmt(t.durationMs) : ""}</span>`;
    li.querySelector("img").src = t.cover;
    li.querySelector(".t-title").textContent = t.title;
    li.querySelector(".t-artist").textContent = t.artist;
    li.onclick = () => load(i);
    ol.appendChild(li);
  });
}

/* ============================================================
   5. Your own files
   Audio files become tracks. An image picked in the same batch becomes
   their cover; without one, a cover is generated from the file name.
   ============================================================ */
document.getElementById("fileInput").addEventListener("change", e => {
  const files = [...e.target.files];
  const image = files.find(f => f.type.startsWith("image/"));
  const imageUrl = image ? URL.createObjectURL(image) : null;
  const added = files.filter(f => f.type.startsWith("audio/")).map(f => ({
    title: f.name.replace(/\.[^.]+$/, ""),
    artist: "Your library",
    src: URL.createObjectURL(f),
    cover: imageUrl || makeCover(hash(f.name)),
    durationMs: 0,
  }));
  if (!added.length) return;
  const first = tracks.length;
  tracks.push(...added);
  buildOrder(true);
  renderList();
  added.forEach((t, k) => {
    const probe = new Audio(t.src);
    probe.addEventListener("loadedmetadata", () => { t.durationMs = probe.duration * 1000; renderList(); highlight(); });
  });
  load(first);
  e.target.value = "";
});
const highlight = () => document.querySelectorAll("#trackList li").forEach((li, i) => li.classList.toggle("active", i === order[cursor]));
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

/* ============================================================
   6. Built-in demo tracks (synthesized; no external assets)
   ============================================================ */
function makeCover(seed) {
  const rnd = mulberry(seed);
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  const hue = rnd() * 360;
  const grad = g.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, `hsl(${hue},70%,${35 + rnd() * 20}%)`);
  grad.addColorStop(1, `hsl(${(hue + 40) % 360},60%,${12 + rnd() * 10}%)`);
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 7; i++) {
    g.beginPath();
    g.arc(rnd() * 512, rnd() * 512, 40 + rnd() * 180, 0, Math.PI * 2);
    g.fillStyle = `hsla(${(hue + rnd() * 80 - 40 + 360) % 360},80%,${40 + rnd() * 35}%,${0.25 + rnd() * 0.4})`;
    g.fill();
  }
  return c.toDataURL("image/png");
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

async function synth({ bpm, chords, seconds, wave }) {
  const rate = 22050;
  const ctx = new OfflineAudioContext(1, rate * seconds, rate);
  const master = ctx.createGain(); master.gain.value = 0.18; master.connect(ctx.destination);
  const beat = 60 / bpm, bar = beat * 4;
  for (let t = 0, i = 0; t < seconds; t += bar, i++) {
    const chord = chords[i % chords.length];
    chord.forEach(midi => {
      const o = ctx.createOscillator(), env = ctx.createGain();
      o.type = wave; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.6, t + 0.05);
      env.gain.exponentialRampToValueAtTime(0.01, t + bar);
      o.connect(env).connect(master); o.start(t); o.stop(t + bar);
    });
    for (let b = 0; b < 4; b++) { // soft pulse on each beat
      const o = ctx.createOscillator(), env = ctx.createGain(), bt = t + b * beat;
      o.frequency.setValueAtTime(110, bt); o.frequency.exponentialRampToValueAtTime(40, bt + 0.15);
      env.gain.setValueAtTime(0.9, bt); env.gain.exponentialRampToValueAtTime(0.001, bt + 0.2);
      o.connect(env).connect(master); o.start(bt); o.stop(bt + 0.2);
    }
  }
  const buf = await ctx.startRendering();
  return URL.createObjectURL(toWav(buf));
}
function toWav(buf) {
  const pcm = buf.getChannelData(0), n = pcm.length, view = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((ch, i) => view.setUint8(o + i, ch.charCodeAt(0)));
  str(0, "RIFF"); view.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, buf.sampleRate, true); view.setUint32(28, buf.sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, "data"); view.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return new Blob([view], { type: "audio/wav" });
}

const DEMO = [
  { title: "Low Tide", artist: "Demo · synthesized", seed: 11, bpm: 84, wave: "sine", chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]] },
  { title: "Glass Harbor", artist: "Demo · synthesized", seed: 404, bpm: 100, wave: "triangle", chords: [[62, 65, 69], [58, 62, 65], [60, 64, 67], [57, 61, 64]] },
  { title: "Night Ferry", artist: "Demo · synthesized", seed: 2024, bpm: 72, wave: "sine", chords: [[52, 55, 59], [48, 52, 55], [50, 54, 57], [47, 50, 54]] },
];

(async function init() {
  tracks = DEMO.map(d => ({ title: d.title, artist: d.artist, cover: makeCover(d.seed), src: "", durationMs: 30000 }));
  buildOrder(false);
  renderList();
  load(0, false);
  // Render audio after first paint so the UI appears instantly.
  for (let i = 0; i < DEMO.length; i++) {
    tracks[i].src = await synth({ ...DEMO[i], seconds: 30 });
    if (i === order[cursor] && !audio.getAttribute("src")) audio.src = tracks[i].src;
  }
})();
